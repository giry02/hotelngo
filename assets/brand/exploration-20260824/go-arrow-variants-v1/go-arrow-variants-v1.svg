<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">HotelNGo GO capsule arrow six proposals</title>
  <desc id="desc">Six compact GO capsule variants comparing arrow length, weight, head style, and right padding.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="57" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C6B7"/>
      <stop offset="0.48" stop-color="#1CB3E5"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12223F" flood-opacity=".08"/>
    </filter>
    <style>
      .ui{font-family:Arial,'Malgun Gothic',sans-serif}.logo{font-family:'Arial Narrow',Arial,sans-serif;font-weight:800;letter-spacing:-.8px;fill:#fff}.label{font-size:14px;font-weight:800;letter-spacing:1.2px;fill:#2F6BFF}.name{font-size:23px;font-weight:800;fill:#181B1A}.copy{font-size:15px;fill:#677186}.spec{font-size:13px;font-weight:700;fill:#8A93A3}.actual{font-size:12px;font-weight:700;fill:#8A93A3}.card{fill:#fff;stroke:#DDE3EC;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#F5F7FA"/>
  <text class="ui" x="70" y="65" font-size="30" font-weight="800" fill="#181B1A">GO 캡슐 화살표 축소 6안</text>
  <text class="ui" x="70" y="96" font-size="15" fill="#677186">공식 그라데이션과 GO 비율은 유지하고, 화살표와 오른쪽 여백만 비교합니다. 실제 로고에는 아직 적용하지 않았습니다.</text>

  <g class="ui" transform="translate(70 130)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">01 · BALANCED</text><text class="name" x="26" y="72">균형형</text><text class="copy" x="26" y="98">짧은 선과 작은 화살촉의 기본안</text>
    <g transform="translate(79 121) scale(3)"><rect width="56" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h12.5m-3.4-3.4L48 15l-3.4 3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="56" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h12.5m-3.4-3.4L48 15l-3.4 3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="spec" x="202" y="249">56 × 30</text>
  </g>
  <g class="ui" transform="translate(435 130)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">02 · SLIM</text><text class="name" x="26" y="72">슬림형</text><text class="copy" x="26" y="98">가장 얇고 짧은 직선 화살표</text>
    <g transform="translate(84 121) scale(3)"><rect width="54" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h11.5m-2.8-2.8L47 15l-2.8 2.8" fill="none" stroke="#fff" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="54" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h11.5m-2.8-2.8L47 15l-2.8 2.8" fill="none" stroke="#fff" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></g><text class="spec" x="200" y="249">54 × 30</text>
  </g>
  <g class="ui" transform="translate(800 130)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">03 · CHEVRON</text><text class="name" x="26" y="72">셰브론형</text><text class="copy" x="26" y="98">선 없이 방향만 남긴 최소형</text>
    <g transform="translate(87 121) scale(3)"><rect width="52" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M40 11.5 43.5 15 40 18.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="52" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M40 11.5 43.5 15 40 18.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text class="spec" x="198" y="249">52 × 30</text>
  </g>

  <g class="ui" transform="translate(70 455)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">04 · SOLID</text><text class="name" x="26" y="72">솔리드형</text><text class="copy" x="26" y="98">작은 면으로 또렷하게 보이는 화살표</text>
    <g transform="translate(82 121) scale(3)"><rect width="55" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35 13.8h7v-2.7l6 3.9-6 3.9v-2.7h-7z" fill="#fff"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="55" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35 13.8h7v-2.7l6 3.9-6 3.9v-2.7h-7z" fill="#fff"/></g><text class="spec" x="201" y="249">55 × 30</text>
  </g>
  <g class="ui" transform="translate(435 455)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">05 · SOFT</text><text class="name" x="26" y="72">라운드형</text><text class="copy" x="26" y="98">굵고 둥글지만 전체 길이는 짧게</text>
    <g transform="translate(78 121) scale(3)"><rect width="57" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M36.5 15h12m-3.8-3.8 3.8 3.8-3.8 3.8" fill="none" stroke="#fff" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="57" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M36.5 15h12m-3.8-3.8 3.8 3.8-3.8 3.8" fill="none" stroke="#fff" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></g><text class="spec" x="203" y="249">57 × 30</text>
  </g>
  <g class="ui" transform="translate(800 455)" filter="url(#shadow)">
    <rect class="card" width="330" height="285" rx="22"/>
    <text class="label" x="26" y="39">06 · SPLIT</text><text class="name" x="26" y="72">분리형</text><text class="copy" x="26" y="98">선과 촉을 나눠 가벼운 리듬을 준 안</text>
    <g transform="translate(84 121) scale(3)"><rect width="54" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h6.2M42.5 11.7 45.8 15l-3.3 3.3" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="actual" x="26" y="249">실제 헤더 크기</text><g transform="translate(128 229)"><rect width="54" height="30" rx="15" fill="url(#g)"/><text class="logo" x="7" y="21" font-size="17">GO</text><path d="M35.5 15h6.2M42.5 11.7 45.8 15l-3.3 3.3" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></g><text class="spec" x="200" y="249">54 × 30</text>
  </g>
</svg>
