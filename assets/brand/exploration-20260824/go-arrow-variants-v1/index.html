<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HotelNGo GO 화살표 축소 6안</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f7fa;color:#181b1a;font-family:Arial,'Malgun Gothic',sans-serif}main{width:min(1200px,100%);margin:0 auto;padding:24px}img{display:block;width:100%;height:auto;border:0}p{margin:16px 0 0;color:#677186;font-size:14px}.files{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}.files a{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid #dce2ec;border-radius:10px;background:#fff;color:#1d4ed8;text-decoration:none;font-weight:700;font-size:13px}@media(max-width:760px){main{padding:10px}.files{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main>
    <img src="go-arrow-variants-v1.svg" alt="GO 캡슐 화살표 축소 6개 비교 시안">
    <div class="files" aria-label="개별 SVG 파일">
      <a href="go-capsule-01-balanced.svg">01 균형형</a>
      <a href="go-capsule-02-slim.svg">02 슬림형</a>
      <a href="go-capsule-03-chevron.svg">03 셰브론형</a>
      <a href="go-capsule-04-solid.svg">04 솔리드형</a>
      <a href="go-capsule-05-soft.svg">05 라운드형</a>
      <a href="go-capsule-06-split.svg">06 분리형</a>
    </div>
    <p>비교 전용 시안입니다. 공식 로고와 홈페이지에는 아직 적용되지 않았습니다.</p>
  </main>
</body>
</html>
