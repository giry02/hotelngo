<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="HotelnGo 해외 항공 탐색 화면"><title>해외 항공 · HotelnGo</title>
  <link rel="icon" href="assets/brand/official/hotelngo-symbol-primary.png" type="image/png">
  <link rel="stylesheet" href="styles/tokens.css?v=10"><link rel="stylesheet" href="styles/main.css?v=29"><link rel="stylesheet" href="styles/pages.css?v=18">
  <script src="scripts/site-shell.js?v=13" defer></script><script src="scripts/mock-api.js?v=7" defer></script><script src="scripts/platform-flows.js?v=7" defer></script><script src="scripts/auth.js?v=4" defer></script><script src="scripts/main.js?v=14" defer></script><script src="scripts/pages.js?v=9" defer></script><script src="scripts/flight-search.js?v=1" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a><div data-site-header></div>
  <main class="page-main" id="main-content">
    <section class="route-hero"><div class="shell route-hero-grid">
      <div><span class="page-eyebrow">OVERSEAS FLIGHTS</span><h1 class="page-title"><span data-flight-destination>다낭</span>으로 가는 항공편,<br>일정에 맞춰 가볍게 비교</h1><p class="page-lead">해외 노선을 중심으로 출도착 시간, 수하물과 환승 조건을 비교합니다.</p><div class="route-tabs"><a class="is-active" href="flights.html">왕복</a><a href="flights.html">편도</a><a href="flights.html">다구간</a></div></div>
      <div class="route-hero-art"><img data-flight-hero src="assets/images/hero-hotel.jpg" alt="다낭 여행 풍경"></div>
    </div></section>
    <div class="shell">
      <form class="search-panel field-grid" data-search-page data-flight-search>
        <label class="field-box"><span>출발</span><input name="origin" value="서울 (ICN)" aria-label="출발지"></label>
        <label class="field-box"><span>도착</span><input name="destination" value="다낭 (DAD)" aria-label="도착지"></label>
        <label class="field-box"><span>가는 날</span><input name="departDate" type="date" aria-label="가는 날"></label>
        <label class="field-box"><span>오는 날</span><input name="returnDate" type="date" aria-label="오는 날"></label>
        <button class="ui-button primary" type="submit">항공 검색</button>
      </form>
      <section class="content-section"><div class="state-banner"><div><strong>현재 제공: 항공편 비교와 일정 저장</strong><p>실시간 운임·좌석·발권 API는 없습니다. 표기 가격은 Mock 예상값이며 결제나 예약으로 이어지지 않습니다.</p></div><span class="status-chip warning">비교 전용</span></div></section>
      <section class="content-section">
        <div class="content-section-head"><div><h2>추천 시간대</h2><p><span data-flight-route>서울 출발 · 다낭 왕복 · 이코노미</span> · <span data-flight-count>0</span>개</p></div></div>
        <div class="flight-filters"><label><input type="checkbox" data-flight-direct> 직항만</label><label>최대 요금 <select data-flight-max><option value="2000000">제한 없음</option><option value="600000">60만원</option><option value="400000">40만원</option></select></label></div>
        <div class="flight-list" data-flight-list><div class="empty-state"><strong>항공편 데이터를 확인하고 있습니다.</strong></div></div>
      </section>
    </div>
  </main>
  <div data-site-footer></div><div class="toast" role="status" aria-live="polite" data-toast></div><div data-site-mobile-nav data-active="home"></div>
</body>
</html>
